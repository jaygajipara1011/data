<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySQL Connection Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 15px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #263238;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .title {
            padding: 22px 28px;
            border-bottom: 1px solid #ddd;
            font-size: 22px;
            font-weight: bold;
        }

        .body {
            padding: 28px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .field {
            margin-bottom: 28px;
        }

        .label {
            color: #607d8b;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 9px;
            text-transform: uppercase;
        }

        .value {
            font-size: 16px;
            color: #263238;
        }

        .input-field {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        .date-input {
            background: #f3f3f3;
            cursor: not-allowed;
        }

        .database {
            font-size: 16px;
            color: #3949ab;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 6px;
            background: #6f42c1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #59339d;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="title">
            MySQL Connection Details
        </div>

        <div class="body">

            <form onsubmit="submitForm(event)">

                <div class="row">

                    <!-- LEFT -->
                    <div>

                        <div class="field">
                            <div class="label">MySQL Username</div>
                            <div class="value">if0_42501725</div>
                        </div>

                        <div class="field">
                            <div class="label">MySQL Hostname</div>
                            <div class="value">sql200.infinityfree.com</div>
                        </div>

                        <div class="field">
                            <div class="label">Today's Date</div>

                            <input
                                type="text"
                                id="todayDate"
                                class="input-field date-input"
                                disabled
                            >
                        </div>

                        <div class="field">
                            <div class="label">Extra Input</div>

                            <input
                                type="text"
                                id="extraInput"
                                class="input-field"
                                placeholder="Enter value"
                                required
                            >
                        </div>

                    </div>

                    <!-- RIGHT -->
                    <div>

                        <div class="field">
                            <div class="label">MySQL Password</div>
                            <div class="value">RC9cpVZnvIM</div>
                        </div>

                        <div class="field">
                            <div class="label">MySQL Port (Optional)</div>
                            <div class="value">3306</div>
                        </div>

                    </div>

                </div>

                <!-- SUBMIT -->
                <button type="submit" class="submit-btn">
                    Submit
                </button>

            </form>

        </div>

    </div>


    <div class="card">

        <div class="title">
            List of MySQL Databases
        </div>

        <div class="body">

            <div class="label">
                Database Name
            </div>

            <div class="database">
                if0_42501725_data
            </div>

        </div>

    </div>

</div>


<script>

    // Today's date
    function setTodayDate() {

        const now = new Date();

        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();

        document.getElementById('todayDate').value =
            day + '-' + month + '-' + year;
    }

    setTodayDate();


    // Submit
    function submitForm(event) {

        event.preventDefault();

        const value =
            document.getElementById('extraInput').value;

        alert("Submitted successfully!\nValue: " + value);
    }

</script>

</body>
</html>
