<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Details</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .card {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .title {
            padding: 20px;
            border-bottom: 1px solid #ddd;
            font-size: 20px;
            font-weight: bold;
        }

        .body {
            padding: 25px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        label {
            display: block;
            color: #607d8b;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .value {
            font-size: 16px;
            margin-bottom: 25px;
        }

        input {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f5f5f5;
        }

        @media(max-width:600px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="title">
        MySQL Connection Details
    </div>

    <div class="body">

        <div class="row">

            <div>
                <label>MYSQL USERNAME</label>
                <div class="value">if0_42501725</div>

                <label>MYSQL HOSTNAME</label>
                <div class="value">sql200.infinityfree.com</div>

                <label>TODAY'S DATE</label>
                <input type="text" id="todayDate" disabled>
            </div>

            <div>
                <label>MYSQL PASSWORD</label>
                <div class="value">RC9cpVZnvIM</div>

                <label>MYSQL PORT (OPTIONAL)</label>
                <div class="value">3306</div>
            </div>

        </div>

    </div>
</div>

<div class="card">

    <div class="title">
        List of MySQL Databases
    </div>

    <div class="body">

        <label>DATABASE NAME</label>

        <div class="value">
            if0_42501725_data
        </div>

    </div>

</div>

<script>
    const today = new Date();

    const day = String(today.getDate()).padStart(2, '0');
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const year = today.getFullYear();

    document.getElementById('todayDate').value =
        `${day}-${month}-${year}`;
</script>

</body>
</html>
