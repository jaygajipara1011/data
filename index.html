<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySQL Connection Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 15px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #263238;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .title {
            padding: 22px 28px;
            border-bottom: 1px solid #ddd;
            font-size: 22px;
            font-weight: bold;
        }

        .body {
            padding: 28px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .field {
            margin-bottom: 28px;
        }

        .label {
            color: #607d8b;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 9px;
            text-transform: uppercase;
        }

        .value {
            font-size: 16px;
            color: #263238;
        }

        .date-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f3f3f3;
            font-size: 15px;
            color: #333;
        }

        .database {
            font-size: 16px;
            color: #3949ab;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .title {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- MySQL Connection Details -->
    <div class="card">

        <div class="title">
            MySQL Connection Details
        </div>

        <div class="body">

            <div class="row">

                <div>

                    <div class="field">
                        <div class="label">MySQL Username</div>
                        <div class="value">if0_42501725</div>
                    </div>

                    <div class="field">
                        <div class="label">MySQL Hostname</div>
                        <div class="value">sql200.infinityfree.com</div>
                    </div>

                    <div class="field">
                        <div class="label">Today's Date</div>

                        <input
                            type="text"
                            id="todayDate"
                            class="date-input"
                            disabled
                        >
                    </div>

                </div>

                <div>

                    <div class="field">
                        <div class="label">MySQL Password</div>
                        <div class="value">RC9cpVZnvIM</div>
                    </div>

                    <div class="field">
                        <div class="label">MySQL Port (Optional)</div>
                        <div class="value">3306</div>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Database List -->
    <div class="card">

        <div class="title">
            List of MySQL Databases
        </div>

        <div class="body">

            <div class="label">
                Database Name
            </div>

            <div class="database">
                if0_42501725_data
            </div>

        </div>

    </div>

</div>


<script>
    function setTodayDate() {

        const now = new Date();

        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();

        document.getElementById('todayDate').value =
            day + '-' + month + '-' + year;
    }

    setTodayDate();
</script>

</body>
</html>
